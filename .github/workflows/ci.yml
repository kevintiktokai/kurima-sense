name: CI

# Tests existed but nothing ran them on push (July 2026 audit). This runs the
# typecheck + unit tests on every push/PR to main. Both are deterministic and
# need no secrets or network.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          # Node 22 (LTS): has native WebSocket, which @supabase/realtime-js
          # requires at import time. On Node 20 (no native WebSocket) the test
          # files that transitively import the Supabase client throw at load
          # ("Node.js 20 detected without native WebSocket support"). Node 20 is
          # also being deprecated on GitHub runners.
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Typecheck
        run: npx tsc --noEmit
      - name: Unit tests
        run: npm test
